<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: História dos Quilombos no Brasil e PE</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fontes do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Ícones FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="quiz-container">
        <!-- Tela Inicial -->
        <div id="start-screen" class="quiz-card text-center">
            <div class="icon-header">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1>Quiz: História dos Quilombos</h1>
            <p>Teste seus conhecimentos sobre a história, lideranças e territorialidade das comunidades quilombolas no Brasil e em Pernambuco.</p>
            <div class="quiz-info">
                <span><i class="fa-solid fa-list-check"></i> 7 Perguntas</span>
                <span><i class="fa-solid fa-clock"></i> Sem limite de tempo</span>
            </div>
            <button id="start-btn" class="btn">Iniciar Quiz</button>
        </div>

        <!-- Tela de Perguntas (Oculta no início) -->
        <div id="quiz-screen" class="quiz-card hidden">
            <!-- Barra de Progresso -->
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            
            <div class="quiz-header">
                <span id="question-number">Pergunta 1 de 7</span>
            </div>

            <h2 id="question-text">Texto da Pergunta</h2>

            <div id="options-container" class="options-grid">
                <!-- Opções serão inseridas via JavaScript -->
            </div>

            <div class="quiz-footer">
                <button id="next-btn" class="btn hidden">Próxima Pergunta <i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </div>

        <!-- Tela de Resultado (Oculta no início) -->
        <div id="result-screen" class="quiz-card text-center hidden">
            <div id="result-icon" class="icon-header">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h2>Resultado Final</h2>
            <div class="score-display">
                <span id="score-number">0</span> / <span id="total-questions">7</span>
            </div>
            <p id="score-feedback">Mensagem de feedback baseada no resultado.</p>
            
            <button id="restart-btn" class="btn"><i class="fa-solid fa-rotate-right"></i> Tentar Novamente</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
